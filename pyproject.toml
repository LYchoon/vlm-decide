[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-decide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<2.9", "transformers==4.57.1", "accelerate>=1.10,<2", "Pillow>=10"]

[project.scripts]
vlm-decide = "vlm_decide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
